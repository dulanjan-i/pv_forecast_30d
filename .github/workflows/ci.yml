name: CI — pytest

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements/requirements_test.txt'
      - 'pytest.ini'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements/requirements_test.txt'
      - 'pytest.ini'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: pytest (Python 3.11, CPU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python 3.11 matches the pvforecast conda env and Docker image
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache pip packages keyed on requirements_test.txt hash.
      # First run: ~8 min (downloads torch+forecasting). Subsequent runs: ~30s.
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ runner.os }}-${{ hashFiles('requirements/requirements_test.txt') }}
          restore-keys: |
            pip-test-${{ runner.os }}-

      # Install CPU-only torch explicitly first to avoid the default CUDA wheel
      - name: Install PyTorch (CPU-only)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: |
          pip install -r requirements/requirements_test.txt \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple

      # Run unit tests — exclude files that require external APIs, real data,
      # or HPC paths (ECMWF key, parquet datasets, real TFT model files).
      # These are integration tests by nature; they run in the pvforecast env locally.
      - name: Run pytest
        run: |
          python -m pytest tests/ \
            -m "not integration" \
            --ignore=tests/test_ecmwf_opendata.py \
            --ignore=tests/test_weather_api_comparison.py \
            --ignore=tests/test_live_weather_forecast.py \
            --ignore=tests/test_full_pipeline_real_tft.py \
            --ignore=tests/test_hierarchical_pipeline.py \
            --ignore=tests/test_rl_integration.py \
            --ignore=tests/test_tft_integration.py \
            --ignore=tests/test_action_executors.py \
            --tb=short \
            --junitxml=test-results.xml \
            -v

      # Publish test results so they appear in the GitHub Actions summary tab
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          retention-days: 14
