# =============================================================================
# MiRACLE — Scheduled & On-Demand Inference
# =============================================================================
# Triggers:
#   - Daily at 06:00 UTC (adjust cron to match your timezone / grid market)
#   - Manual dispatch with optional date override
#
# What it does:
#   1. Pulls the latest miracle-inference image from GHCR
#   2. Fetches live weather from OpenMeteo (free, no API key)
#   3. Runs 30-day PV forecast for plant_03
#   4. Uploads forecast parquet as a GitHub Actions artifact (retained 30 days)
#
# View results: Actions tab → "Scheduled Inference" → Artifacts
# =============================================================================

name: Scheduled Inference

on:
  schedule:
    # Daily at 06:00 UTC — adjust to match market open / grid settlement
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      forecast_date:
        description: 'Forecast start date (YYYY-MM-DD). Defaults to today.'
        required: false
        default: ''
      device:
        description: 'Compute device'
        required: false
        default: 'cpu'
        type: choice
        options: [cpu, cuda]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/dulanjan-i/miracle-inference:latest

jobs:
  run-inference:
    name: Run 30-Day PV Forecast
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read  # to pull from GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Resolve forecast date — use input if provided, else today in UTC
      - name: Resolve forecast date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.forecast_date }}" ]; then
            echo "date=${{ github.event.inputs.forecast_date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      # Pull from GHCR — uses GITHUB_TOKEN, no extra setup needed for public repos
      - name: Pull inference image
        run: docker pull ${{ env.IMAGE }}

      # Verify checkpoint integrity before running inference.
      # Uses Python hashlib inside the container — avoids path mismatch between
      # the local manifest (freeze/...) and container paths (/app/checkpoints/...).
      - name: Verify checkpoint integrity
        run: |
          docker run --rm ${{ env.IMAGE }} python -c "
          import hashlib, sys, os

          EXPECTED = {
              '/app/V1.0_FINAL_TFT/shorthead_seed42/checkpoints/best.pt':
                  '5d9568f624258d5db46d0b346fee95f3c4fa6da28e224a1fdd95f17808944137',
              '/app/V1.0_FINAL_TFT/longhead_seed43/checkpoints/best.pt':
                  '1a21bc37ee7aef146756cceb64992d91fdd8d7fafd4e650c96cbd494fc66968e',
              '/app/checkpoints/rl_v2/ddqn_best.pt':
                  'bcc32ceb87765fe5dd90248e639619b17fd1a137b2592f8cd431cac03f75e549',
          }

          failed = []
          for path, expected_sha in EXPECTED.items():
              if not os.path.exists(path):
                  failed.append(f'MISSING: {path}')
                  continue
              sha = hashlib.sha256(open(path, 'rb').read()).hexdigest()
              if sha != expected_sha:
                  failed.append(f'CORRUPT: {path} (got {sha[:12]}...)')
              else:
                  print(f'OK: {os.path.basename(path)}')

          if failed:
              print('FAILED:', failed, file=sys.stderr)
              sys.exit(1)
          print('All checkpoints verified.')
          "

      # Run 30-day forecast — mounts outputs/ so the parquet is accessible on the host
      - name: Run 30-day PV forecast
        run: |
          mkdir -p outputs
          docker run --rm \
            -v ${{ github.workspace }}/outputs:/app/outputs \
            -e MIRACLE_FORECAST_DATE=${{ steps.date.outputs.date }} \
            ${{ env.IMAGE }} \
            /app/scripts/run_inference.sh \
              --date ${{ steps.date.outputs.date }} \
              --output-dir /app/outputs

      # Upload forecast as a downloadable artifact (retained 30 days)
      - name: Upload forecast artifact
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ steps.date.outputs.date }}
          path: outputs/forecast_${{ steps.date.outputs.date }}.parquet
          retention-days: 30

      - name: Print summary
        run: |
          echo "## MiRACLE Forecast Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** ${{ steps.date.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ env.IMAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** forecast-${{ steps.date.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Checkpoint manifest:** verified OK" >> $GITHUB_STEP_SUMMARY
