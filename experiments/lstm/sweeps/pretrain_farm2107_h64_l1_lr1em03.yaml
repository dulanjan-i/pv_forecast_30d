experiment:
  name: farm2107_pretrain_sweep
  tag: h64_l1_lr1em03
paths:
  output_dir: experiments/lstm/runs/farm2107_h64_l1_lr1em03
data:
  train_path: data/processed/pretraining/farm2107_pretrain_train.parquet
  val_path: data/processed/pretraining/farm2107_pretrain_val.parquet
  time_col: measured_on
  id_col: null
  feature_cols:
  - pv_power_norm
  - poa_irradiance
  - temperature_2m
  - relative_humidity_2m
  - precipitation
  - weather_code
  - cloud_cover
  - wind_speed_10m
  - wind_direction_10m
  - shortwave_radiation_instant
  - direct_radiation_instant
  - diffuse_radiation_instant
  - direct_normal_irradiance_instant
  - global_tilted_irradiance_instant
  - surface_pressure
  target_col: pv_power_norm
  window_size: 96
  horizon: 1
model:
  hidden_size: 64
  num_layers: 1
  dropout: 0.1
training:
  batch_size: 256
  max_epochs: 20
  learning_rate: 0.001
  weight_decay: 1e-4
  gradient_clip_val: 1.0
  gpus: 1
  num_workers: 2
