# experiments/lstm/pretrain_pvdaq.yaml
data:
  train_path: "data/raw/pvdaq_nsrd_train.csv"
  val_path: "data/raw/pvdaq_nsrd_val.csv"
  time_col: "time_idx"
  id_col: "site_id"
  feature_cols:
    - ghi
    - dni
    - dhi
    - t_air
    - wind_speed
    - rel_humidity
    - pressure
  target_col: "pv_power_norm"
  window_size: 96          # encoder length
  horizon: 1               # next-step or short horizon for encoder pretrain

model:
  hidden_size: 64
  num_layers: 2
  dropout: 0.1

training:
  batch_size: 256
  max_epochs: 30
  learning_rate: 1e-3
  weight_decay: 1e-4
  gpus: 0