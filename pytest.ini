[pytest]
***REMOVED*** Register custom marks so pytest doesn't warn about unknown marks
markers =
    integration: Tests requiring full training environment, external services, or real data.
                 Skip by default; run explicitly with: pytest -m integration

***REMOVED*** Default: skip integration tests unless explicitly requested
***REMOVED*** To run only fast unit tests: pytest (no flags needed — integration tests are marked skip)
***REMOVED*** To run integration tests: pytest -m integration
addopts = -q
