# MiRACLE v1.0 — Docker Compose
# Usage:
#   docker-compose run --rm inference                        # today's forecast
#   docker-compose run --rm inference --date 2026-01-02     # specific date
#   docker-compose run --rm verify                          # integrity check only

services:
  inference:
    image: ghcr.io/dulanjan-i/miracle-inference:latest
    command: ["/app/scripts/run_inference.sh"]
    volumes:
      - ./outputs:/app/outputs
    environment:
      - MIRACLE_RL_CKPT=/app/checkpoints/rl_v2/ddqn_best.pt
      - MIRACLE_SHORT_CKPT=/app/V1.0_FINAL_TFT/shorthead_seed42/checkpoints/best.pt
      - MIRACLE_LONG_CKPT=/app/V1.0_FINAL_TFT/longhead_seed43/checkpoints/best.pt
      - MIRACLE_PLANT_META=/app/V1.0_FINAL_TFT/plant_metadata/plant_03.json

  verify:
    image: ghcr.io/dulanjan-i/miracle-inference:latest
    command:
      - python
      - -c
      - |
        import hashlib, os, sys
        OK = {
          '/app/V1.0_FINAL_TFT/shorthead_seed42/checkpoints/best.pt':
            '5d9568f624258d5db46d0b346fee95f3c4fa6da28e224a1fdd95f17808944137',
          '/app/V1.0_FINAL_TFT/longhead_seed43/checkpoints/best.pt':
            '1a21bc37ee7aef146756cceb64992d91fdd8d7fafd4e650c96cbd494fc66968e',
          '/app/checkpoints/rl_v2/ddqn_best.pt':
            'bcc32ceb87765fe5dd90248e639619b17fd1a137b2592f8cd431cac03f75e549',
        }
        failed = [p for p, h in OK.items()
                  if not os.path.exists(p) or
                  hashlib.sha256(open(p,'rb').read()).hexdigest() != h]
        print('ALL OK' if not failed else f'FAILED: {failed}')
        sys.exit(len(failed))
